[package]
name = "blackbox"
version = "0.1.0"
edition = "2021"
description = "Post-incident flight recorder: bounded in-memory ring buffer of the last N events."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "blackbox"
path = "src/lib.rs"
